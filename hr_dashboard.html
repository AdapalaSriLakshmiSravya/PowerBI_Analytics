<title>HR Analytics Dashboard</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1d2330;--mu:#6b7385;--bd:#e1e4ea;--c0:#2f6fdb;--c1:#e08a1e;--wn:#c0392b;--wb:#fdecea;--tr:#e9ecf2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--card:#1d222b;--tx:#e8ebf1;--mu:#98a1b3;--bd:#2c3340;--c0:#5b9bff;--c1:#f0a64a;--wn:#ff8a7a;--wb:#3a2321;--tr:#2a303c}}
:root[data-theme="dark"]{--bg:#14171d;--card:#1d222b;--tx:#e8ebf1;--mu:#98a1b3;--bd:#2c3340;--c0:#5b9bff;--c1:#f0a64a;--wn:#ff8a7a;--wb:#3a2321;--tr:#2a303c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:16px 20px 0}h1{margin:0;font-size:20px}.sub{color:var(--mu);font-size:12px}
nav{display:flex;gap:6px;overflow-x:auto;padding:12px 20px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;font:inherit}
nav button.on{background:var(--c0);border-color:var(--c0);color:#fff}
main{padding:0 20px 28px;max-width:1300px;margin:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px}
.kpi b{display:block;font-size:24px;margin-top:2px}.kpi span{color:var(--mu);font-size:12px}
.kpi.warn{background:var(--wb);border-color:var(--wn)}.kpi.warn b,.kpi.warn span{color:var(--wn)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;min-width:0}
.box h3{margin:0 0 8px;font-size:13px}.row{display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:center;margin:4px 0;font-size:12px}
.row>div:first-child{color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr{background:var(--tr);border-radius:4px;display:flex;height:16px;position:relative}
.bar{height:16px;display:flex;align-items:center}.bars{display:grid;gap:2px}
.bar i{height:100%;border-radius:4px;display:block}.bar em{font-style:normal;font-size:11px;margin-left:5px;white-space:nowrap}
.lg{font-size:11px;color:var(--mu);margin-bottom:6px}.lg s{display:inline-block;width:9px;height:9px;border-radius:2px;margin:0 4px 0 8px;text-decoration:none}
.alert{background:var(--wb);border:1px solid var(--wn);color:var(--wn);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.sl{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.sl b{font-size:12px;color:var(--mu);margin:0 4px 0 10px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px;padding:4px 11px;cursor:pointer;font:inherit;font-size:12px}.chip.on{background:var(--c0);color:#fff;border-color:var(--c0)}
.sc{overflow-x:auto;max-height:420px;overflow-y:auto}table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{position:sticky;top:0;background:var(--card)}
td.c{text-align:center}tr.cf td{background:var(--wb);color:var(--wn)}select{font:inherit;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:3px 6px}
.note{color:var(--mu);font-size:12px;margin:8px 0 0}
</style></head><body>

['Promotion & Retrenchment',()=>{const x=D.filter(r=>r.pr||r.rt).sort((p,q)=>(q.pr&q.rt)-(p.pr&p.rt)||p.n.localeCompare(q.n)),lv=D.map(r=>({...r,L:'Level '+r.lvl}));
 return cards(['pr','rt','cf'],D)+grid([chart('By Department',D,'dep',['pr','rt'],{stack:1}),chart('By Job Role',D,'role',['pr','rt'],{stack:1}),chart('By Job Level',lv,'L',['pr','rt'],{stack:1,order:[1,2,3,4,5].map(x=>'Level '+x)})])+
 `<div class="box" style="margin-top:12px"><h3>Affected employees: performance and tenure (${x.length} employees; red rows are in both lists)</h3><div class="sc"><table><tr><th>Employee</th><th>Department</th><th>Job Role</th><th class="c">Promotion Due</th><th class="c">Retrenchment</th><th class="c">Performance Rating</th><th class="c">Tenure (yrs)</th></tr>${x.map(r=>`<tr class="${r.pr&&r.rt?'cf':''}" data-e="${r.id}" style="cursor:pointer"><td>${r.n}</td><td>${r.dep}</td><td>${r.role}</td><td class="c">${r.pr}</td><td class="c">${r.rt}</td><td class="c">${r.perf}</td><td class="c">${r.yrs}</td></tr>`).join('')}</table></div></div>`}],['HR Risk & Employee Detail',()=>{const RC=['Low','Medium','High','Critical'],hrk=a=>a.length?sum(a,r=>r.rk>=3)/a.length:0,deps=[...new Set(D.map(r=>r.dep))].sort(),roles=[...new Set(D.map(r=>r.role))].sort();
 const heat=`<div class="sc"><table><tr><th>Department</th>${roles.map(x=>`<th class="c">${x}</th>`).join('')}</tr>${deps.map(d=>`<tr><td>${d}</td>${roles.map(x=>{const g=D.filter(r=>r.dep==d&&r.role==x);return g.length?`<td class="c" style="background:color-mix(in srgb,var(--wn) ${Math.round(hrk(g)*100)}%,transparent)">${pct(hrk(g))}</td>`:'<td class="c">-</td>'}).join('')}</tr>`).join('')}</table></div>`;
 const rm=`<table><tr><th>OverTime</th>${ORD.sat.map(s=>`<th class="c">Job Sat ${s}</th>`).join('')}</tr>${['No','Yes'].map(o=>`<tr><td>${o}</td>${ORD.sat.map(s=>{const g=D.filter(r=>r.ot==o&&r.js==s),v=avg(g,r=>r.rk);return `<td class="c" style="background:color-mix(in srgb,var(--wn) ${Math.round(v/5*100)}%,transparent)">${g.length?dec(v):'-'}</td>`}).join('')}</tr>`).join('')}</table>`;
 const mx=[];deps.forEach(d=>{const a=D.filter(r=>r.dep==d);mx.push([d,a,1]);[...new Set(a.map(r=>r.role))].sort().forEach(x=>mx.push(['\u00a0\u00a0'+x,a.filter(r=>r.role==x),0]))});
 const mt=`<div class="sc"><table><tr><th>Department / Role</th><th class="c">Employees</th><th class="c">Attrition Rate</th><th class="c">Avg Income</th><th class="c">Avg Risk Score</th></tr>${mx.map(([n,a,h])=>`<tr style="${h?'font-weight:600':''}"><td>${n}</td><td class="c">${a.length}</td><td class="c">${pct(M.ar[1](a))}</td><td class="c">${num(avg(a,r=>r.inc))}</td><td class="c">${dec(avg(a,r=>r.rk))}</td></tr>`).join('')}</table></div>`;
 const pts=roles.map(x=>{const a=D.filter(r=>r.role==x);return [x,avg(a,r=>r.inc),avg(a,r=>r.yrs),M.ar[1](a),a.length]}),xm=Math.max(...pts.map(p=>p[1]),1),ym=Math.max(...pts.map(p=>p[2]),1);
 const sv=`<svg viewBox="0 0 420 250" style="width:100%"><line x1="40" y1="215" x2="410" y2="215" stroke="var(--bd)"/><line x1="40" y1="10" x2="40" y2="215" stroke="var(--bd)"/>${pts.map(p=>{const X=40+p[1]/xm*350,Y=215-p[2]/ym*190;return `<circle cx="${X}" cy="${Y}" r="${4+p[4]/60}" fill="${p[3]>.17?'var(--wn)':'var(--c0)'}" opacity=".75"/><text x="${X+8}" y="${Y+3}" font-size="9" fill="var(--tx)">${p[0]}</text>`}).join('')}<text x="225" y="242" font-size="10" text-anchor="middle" fill="var(--mu)">Average monthly income</text><text x="12" y="115" font-size="10" fill="var(--mu)" transform="rotate(-90 12 115)" text-anchor="middle">Avg tenure (yrs)</text></svg><div class="note">One dot per job role; red = attrition above 17%.</div>`;
 const det=[...D].sort((a,b)=>b.rk-a.rk||a.n.localeCompare(b.n));
 return cards(['hc','ar'],D)+grid([chart('Risk Category Distribution',D,'rc',['hc'],{order:RC}),`<div class="box"><h3>Risk matrix: average risk score, OverTime x Job Satisfaction</h3>${rm}</div>`,`<div class="box"><h3>Scatter: income vs tenure by job role</h3>${sv}</div>`,`<div class="box"><h3>High Risk % heatmap (risk score 3 or more): Department x Job Role</h3>${heat}</div>`,`<div class="box"><h3>Department to Job Role matrix</h3>${mt}</div>`])+
 `<div class="box" style="margin-top:12px"><h3>Employee detail (${det.length}): click a row to open the Employee Detail page</h3><div class="sc"><table><tr><th>Employee</th><th>Department</th><th>Job Role</th><th>Risk Category</th><th class="c">Promotion Flag</th><th class="c">Retrenchment Flag</th></tr>${det.map(r=>`<tr class="${r.pr&&r.rt?'cf':''}" data-e="${r.id}" style="cursor:pointer"><td>${r.n}</td><td>${r.dep}</td><td>${r.role}</td><td>${r.rc}</td><td class="c">${r.pr}</td><td class="c">${r.rt}</td></tr>`).join('')}</table></div></div>`+
 `<div class="box" style="margin-top:12px"><h3>Data validation checklist (full dataset)</h3><table><tr><th>Check</th><th>Result</th><th>Status</th></tr>${V.map(v=>`<tr><td>${v[0]}</td><td>${v[1]}</td><td style="color:${v[2]=='Pass'?'inherit':'var(--wn)'}">${v[2]}</td></tr>`).join('')}</table></div>`}]];
const detail=()=>{const r=ALL.find(x=>x.id==emp),f=(l,v)=>`<div class="kpi"><span>${l}</span><b style="font-size:16px">${v}</b></div>`;
 return `<button class="chip" data-back="1">&larr; Back</button><h2 style="margin:12px 0 2px">${r.n}</h2><div class="sub">Employee ${r.id}</div>`+(r.pr&&r.rt?`<div class="alert" style="margin-top:10px">This employee is flagged both Due for Promotion and Retrenchment. Validate with the business.</div>`:'')+
 `<div class="cards" style="margin-top:12px">${[['Department',r.dep],['Job Role',r.role],['Age',r.age],['Gender',r.g],['Job Level',r.lvl],['Monthly Income',num(r.inc)],['OverTime',r.ot],['Business Travel',r.bt],['Job Satisfaction',r.js],['Environment Satisfaction',r.es],['Relationship Satisfaction',r.rs],['Work-Life Balance',r.wlb],['Performance Rating',r.perf],['Total Working Years',r.tw],['Years at Company',r.yrs],['Years in Current Role',r.yr],['Years Since Last Promotion',r.yp],['Attrition',r.att?'Yes':'No'],['Due for Promotion',r.pr?'Yes':'No'],['Retrenchment',r.rt?'Yes':'No'],['Risk Score',r.rk+' ('+r.rc+')']].map(x=>f(x[0],x[1])).join('')}</div>`};
const opts=k=>k=='rc'?['Low','Medium','High','Critical']:[...new Set(ALL.map(r=>String(r[k])))].sort();
function draw(){D=ALL.filter(r=>SL.every(([k])=>!S[k].size||S[k].has(String(r[k]))));
 document.getElementById('nav').innerHTML=P.map((p,i)=>`<button class="${i==tab&&emp==null?'on':''}" data-t="${i}">${i+1}. ${p[0]}</button>`).join('');
 if(emp!=null){document.getElementById('m').innerHTML=detail();return}
 const sl=`<div class="sl">${SL.map(([k,l])=>`<b>${l}</b>`+opts(k).map(v=>`<button class="chip ${S[k].has(v)?'on':''}" data-s="${k}" data-v="${v}">${v}</button>`).join('')).join('')}<button class="chip" data-clear="1">Clear</button><span class="sub">${D.length} employees selected</span></div>`;
 document.getElementById('m').innerHTML=sl+P[tab][1]()}
document.addEventListener('click',e=>{const t=e.target.closest('[data-t]'),c=e.target.closest('[data-s]'),r=e.target.closest('[data-e]');
 if(t){tab=+t.dataset.t;emp=null;draw();scrollTo(0,0)}
 else if(c){const s=S[c.dataset.s],v=c.dataset.v;s.has(v)?s.delete(v):s.add(v);draw()}
 else if(e.target.closest('[data-clear]')){SL.forEach(([k])=>S[k].clear());draw()}
 else if(r){emp=+r.dataset.e;draw();scrollTo(0,0)}
 else if(e.target.closest('[data-back]')){emp=null;draw()}});
document.addEventListener('change',e=>{if(e.target.id=='sf'){sf=e.target.value;draw()}if(e.target.id=='mv'){mv=e.target.value;draw()}});
draw();
</script></body></html>
